# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# The registry keeps every published version; to change the listing, bump "version" in server.json.
# Domain proof: a DNS TXT record on onelence.com holds the public key; the private key is the
# MCP_REGISTRY_PRIVATE_KEY secret (hex Ed25519 seed).
name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in with the onelence.com domain key
        run: ./mcp-publisher login dns --domain onelence.com --private-key "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}"

      - name: Publish
        run: ./mcp-publisher publish
